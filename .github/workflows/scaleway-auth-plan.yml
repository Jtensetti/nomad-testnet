name: scaleway-auth-plan

on:
  push:
    branches: [agent/scaleway-wan]
    paths:
      - 'deploy/scaleway/**'
      - '.github/workflows/scaleway-auth-plan.yml'
      - '.github/workflows/scaleway-wan.yml'
  pull_request:
    paths:
      - 'deploy/scaleway/**'
      - '.github/workflows/scaleway-auth-plan.yml'
      - '.github/workflows/scaleway-wan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    # PR validation must never receive cloud credentials. The authenticated
    # provider plan runs only on a trusted branch push or explicit dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # Optional overrides. When PROJECT_ID is absent, the workflow resolves
      # the API key's own default_project_id through Scaleway's read-only IAM
      # endpoint. Organization ID is audit metadata only; Terraform uses the
      # resolved Project ID.
      SCW_PROJECT_ID_SECRET: ${{ secrets.SCW_PROJECT_ID }}
      SCW_ORGANIZATION_ID_SECRET: ${{ secrets.SCW_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/scaleway-wan
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Verify API credentials exist
        id: credentials
        run: |
          set -euo pipefail
          test -n "$SCW_ACCESS_KEY"
          test -n "$SCW_SECRET_KEY"

      - name: Resolve Project scope without creating resources
        id: scope
        run: |
          set -euo pipefail
          project_id="$SCW_PROJECT_ID_SECRET"
          organization_id="$SCW_ORGANIZATION_ID_SECRET"
          project_source=secret
          organization_source=secret

          if [[ -z "$project_id" ]]; then
            key_json="$RUNNER_TEMP/scw-api-key.json"
            curl --fail --silent --show-error --max-time 15 \
              -H "X-Auth-Token: $SCW_SECRET_KEY" \
              -H 'Accept: application/json' \
              "https://api.scaleway.com/iam/v1alpha1/api-keys/$SCW_ACCESS_KEY" \
              -o "$key_json"
            project_id="$(python3 - "$key_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          value = data.get('default_project_id') or ''
          print(value)
          PY
            )"
            project_source=api-key-default
          fi

          if [[ ! "$project_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo 'No valid Scaleway Project ID could be resolved from the secret or API key default_project_id.' >&2
            exit 1
          fi

          # Project and Organization IDs are not passwords, but masking keeps
          # account metadata out of logs and makes the evidence package easier
          # to share with external reviewers.
          echo "::add-mask::$project_id"

          if [[ -z "$organization_id" ]]; then
            project_json="$RUNNER_TEMP/scw-project.json"
            if curl --fail --silent --show-error --max-time 15 \
              -H "X-Auth-Token: $SCW_SECRET_KEY" \
              -H 'Accept: application/json' \
              "https://api.scaleway.com/account/v3/projects/$project_id" \
              -o "$project_json"; then
              organization_id="$(python3 - "$project_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          print(data.get('organization_id') or '')
          PY
              )"
              organization_source=project-lookup
            else
              organization_source=unavailable-non-gating
            fi
          fi

          {
            echo "SCW_PROJECT_ID=$project_id"
            echo "SCW_DEFAULT_PROJECT_ID=$project_id"
            echo "TF_VAR_project_id=$project_id"
          } >> "$GITHUB_ENV"
          if [[ -n "$organization_id" ]]; then
            echo "::add-mask::$organization_id"
            {
              echo "SCW_ORGANIZATION_ID=$organization_id"
              echo "SCW_DEFAULT_ORGANIZATION_ID=$organization_id"
            } >> "$GITHUB_ENV"
          fi
          echo "project_source=$project_source" >> "$GITHUB_OUTPUT"
          echo "organization_source=$organization_source" >> "$GITHUB_OUTPUT"

      - name: Prepare ephemeral plan inputs
        id: inputs
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/nomad-wan-plan" -C "github-plan-${GITHUB_RUN_ID}"
          runner_ip="$(curl -4 --fail --silent --show-error --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "TF_VAR_ssh_public_key=$(cat "$RUNNER_TEMP/nomad-wan-plan.pub")"
            echo "TF_VAR_admin_ipv4_cidr=${runner_ip}/32"
            echo "TF_VAR_deployment_id=plan-${GITHUB_RUN_ID}"
            echo "TF_VAR_ttl_hours=1"
          } >> "$GITHUB_ENV"

      - name: Plan against real Scaleway API
        id: terraform_plan
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence/scaleway-plan
          terraform -chdir=deploy/scaleway init
          terraform -chdir=deploy/scaleway validate
          terraform -chdir=deploy/scaleway plan -refresh=false -lock=false -out="$RUNNER_TEMP/nomad-wan.tfplan"
          terraform -chdir=deploy/scaleway show -no-color "$RUNNER_TEMP/nomad-wan.tfplan" > runtime/evidence/scaleway-plan/terraform-plan.txt
          terraform -chdir=deploy/scaleway show -json "$RUNNER_TEMP/nomad-wan.tfplan" > runtime/evidence/scaleway-plan/terraform-plan.json

      - name: Assert exact create-only plan
        id: exact_plan
        run: |
          python3 - <<'PY'
          import collections, json
          from pathlib import Path

          plan = json.loads(Path('runtime/evidence/scaleway-plan/terraform-plan.json').read_text())
          changes = []
          for resource in plan.get('resource_changes', []):
              actions = resource.get('change', {}).get('actions', [])
              if actions == ['no-op']:
                  continue
              if actions != ['create']:
                  raise SystemExit(f"unexpected action for {resource.get('address')}: {actions}")
              changes.append(resource)

          observed = collections.Counter(resource.get('type') for resource in changes)
          expected = collections.Counter({
              'scaleway_instance_ip': 6,
              'scaleway_instance_security_group': 3,
              'scaleway_instance_security_group_rules': 3,
              'scaleway_instance_server': 3,
          })
          if observed != expected:
              raise SystemExit(f"unexpected plan: {dict(observed)} != {dict(expected)}")

          message = (
              'PASS: authenticated Scaleway API plan is create-only and contains exactly '
              '3 STARDUST1-S servers, 6 routed IPs, 3 security groups and 3 rule sets. '
              'No resources were applied.\n'
          )
          Path('runtime/evidence/scaleway-plan/PLAN_OK.txt').write_text(message)
          print(message, end='')
          PY

      - name: Upload plan evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scaleway-authenticated-plan-${{ github.run_id }}
          path: runtime/evidence/scaleway-plan/
          if-no-files-found: error
          retention-days: 14

      - name: Publish non-secret plan stage status to review branch
        if: always()
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          PROJECT_SOURCE: ${{ steps.scope.outputs.project_source }}
          ORGANIZATION_SOURCE: ${{ steps.scope.outputs.organization_source }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          PLAN_OUTCOME: ${{ steps.terraform_plan.outcome }}
          ASSERT_OUTCOME: ${{ steps.exact_plan.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/testing
          status=docs/testing/SCW_PLAN_STATUS.txt
          {
            echo "authenticated_plan_only=true"
            echo "resources_applied=false"
            echo "access_key_present=$([[ -n "$SCW_ACCESS_KEY" ]] && echo true || echo false)"
            echo "secret_key_present=$([[ -n "$SCW_SECRET_KEY" ]] && echo true || echo false)"
            echo "credentials=${CREDENTIALS_OUTCOME:-not_run}"
            echo "scope_resolution=${SCOPE_OUTCOME:-not_run}"
            echo "project_source=${PROJECT_SOURCE:-not_run}"
            echo "organization_source=${ORGANIZATION_SOURCE:-not_run}"
            echo "inputs=${INPUTS_OUTCOME:-not_run}"
            echo "terraform_plan=${PLAN_OUTCOME:-not_run}"
            echo "exact_resource_assertion=${ASSERT_OUTCOME:-not_run}"
            echo "source_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
          } > "$status"
          if [[ -f runtime/evidence/scaleway-plan/PLAN_OK.txt ]]; then
            cp runtime/evidence/scaleway-plan/PLAN_OK.txt docs/testing/SCW_PLAN_OK.txt
            {
              echo "source_commit=$GITHUB_SHA"
              echo "workflow_run=$GITHUB_RUN_ID"
            } >> docs/testing/SCW_PLAN_OK.txt
          else
            rm -f docs/testing/SCW_PLAN_OK.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/testing/SCW_PLAN_STATUS.txt
          if [[ -f docs/testing/SCW_PLAN_OK.txt ]]; then
            git add -- docs/testing/SCW_PLAN_OK.txt
          else
            git add -u -- docs/testing/SCW_PLAN_OK.txt || true
          fi
          git diff --cached --quiet && exit 0
          git commit -m "docs: record authenticated Scaleway plan status [skip ci]"
          git push origin HEAD:agent/scaleway-wan
