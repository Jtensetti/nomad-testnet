name: operator-shaper-process

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: false

      - name: Build dedicated production shaper
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/nomad-shaper" ./cmd/nomad-shaper
          file "$RUNNER_TEMP/nomad-shaper"

      - name: Verify relay IPC and shaper packages
        run: |
          set -euo pipefail
          go test -race ./live/relayipc ./live/shaper
          go vet ./live/relayipc ./live/shaper ./cmd/nomad-shaper

      - name: Run release-shaped process timing gate with host capture
        env:
          NOMAD_SHAPER_BIN: ${{ runner.temp }}/nomad-shaper
        run: |
          set -uo pipefail
          evidence=runtime/evidence/shaper-process-boundary
          mkdir -p "$evidence"

          sudo tcpdump -i lo -n -U -w "$evidence/shaper-loopback.pcap" \
            '(udp and (host 127.0.0.21 or host 127.0.0.22 or host 127.0.0.23))' \
            >"$evidence/tcpdump.log" 2>&1 &
          tcpdump_pid=$!
          sleep 1

          go test -count=1 -run '^TestShaperProcessTimingBoundary$' ./testnet -v \
            >"$evidence/go-test.log" 2>&1
          test_status=$?

          sudo kill -INT "$tcpdump_pid" >/dev/null 2>&1 || true
          wait "$tcpdump_pid" >/dev/null 2>&1 || true
          if test -s "$evidence/shaper-loopback.pcap"; then
            tcpdump -tt -n -r "$evidence/shaper-loopback.pcap" \
              >"$evidence/shaper-loopback.txt" 2>"$evidence/pcap-read.log" || true
          fi
          cat "$evidence/go-test.log"
          exit "$test_status"

      - name: Upload shaper process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-shaper-process-${{ github.run_id }}
          path: runtime/evidence/shaper-process-boundary/
          if-no-files-found: error
          retention-days: 90
