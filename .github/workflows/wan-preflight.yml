name: WAN preflight

# Reports which Scaleway credential names are present and proves they
# authenticate. It creates nothing and costs nothing: no instance is
# provisioned, and every call it makes is read-only.
#
# It exists because credential names are not enumerable through the API, so
# the campaign workflow has to be told what they are called. Secret VALUES are
# never printed: the checks below emit only "set" or "MISSING", and GitHub
# masks secret values in logs regardless.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wan-preflight.yml'
      # The WAN tooling lives under scripts/wan. This used to name
      # deploy/wan/**, a directory that does not exist, so on push the
      # workflow only ever fired when it was edited itself.
      - 'scripts/wan/**'

permissions:
  contents: read

concurrency:
  # A superseded run tells nobody anything: it is testing a candidate that has
  # already been replaced, while consuming a runner the new candidate needs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Report which credential names are present
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCALEWAY_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCALEWAY_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCALEWAY_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCALEWAY_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_API_KEY: ${{ secrets.SCW_API_KEY }}
          SCW_TOKEN: ${{ secrets.SCW_TOKEN }}
        run: |
          for name in SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID \
                      SCW_DEFAULT_ORGANIZATION_ID SCALEWAY_ACCESS_KEY \
                      SCALEWAY_SECRET_KEY SCALEWAY_PROJECT_ID \
                      SCALEWAY_ORGANIZATION_ID SCW_API_KEY SCW_TOKEN; do
            if [ -n "${!name}" ]; then
              # Deliberately no length: the header above promises that only
              # "set" or "MISSING" is emitted, and the count this printed was
              # the length of the variable's NAME, which told nobody anything.
              printf '%-32s set\n' "$name"
            else
              printf '%-32s MISSING\n' "$name"
            fi
          done

      - name: Install the Scaleway CLI
        run: |
          version=v2.35.0
          curl -fsSL -o /usr/local/bin/scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/${version}/scaleway-cli_${version#v}_linux_amd64"
          chmod +x /usr/local/bin/scw
          scw version

      - name: Authenticate and list projects (read-only)
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          if [ -z "$SCW_ACCESS_KEY" ] || [ -z "$SCW_SECRET_KEY" ]; then
            echo "Scaleway credentials are not present under the SCW_* names."
            echo "The name report above says which names this repository does carry."
            exit 1
          fi
          # Read-only calls only. Nothing here provisions or bills.
          scw account project list -o json | head -40
          echo "--- zones the account can reach ---"
          scw instance server list zone=fr-par-1 -o json | head -5 || true
          echo "preflight complete: credentials authenticate"
