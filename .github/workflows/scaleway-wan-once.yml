name: scaleway-wan-once

on:
  push:
    branches: [agent/scaleway-wan]
    paths:
      - 'deploy/scaleway/RUN_WAN_APPLY'

permissions:
  contents: read
  actions: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}

jobs:
  real-wan-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Validate code and resolve Scaleway Project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCW_ACCESS_KEY"
          test -n "$SCW_SECRET_KEY"
          bash -n scripts/wan/scaleway-provision.sh
          bash -n scripts/wan/resolve-scaleway-project.sh
          python3 -m py_compile scripts/wan/analyze-captures.py scripts/wan/summarize-result.py scripts/capture.py
          terraform -chdir=deploy/scaleway fmt -check -recursive
          terraform -chdir=deploy/scaleway init -backend=false
          terraform -chdir=deploy/scaleway validate
          project_id="$(bash scripts/wan/resolve-scaleway-project.sh)"
          echo "::add-mask::$project_id"
          {
            echo "SCW_DEFAULT_PROJECT_ID=$project_id"
            echo "TF_VAR_project_id=$project_id"
          } >> "$GITHUB_ENV"

      - name: Build exact WAN binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist/wan
          for command in nomad-operator nomad-topology nomad-dkg nomad-node nomad-shaper; do
            go build -trimpath -ldflags='-s -w' -o "dist/wan/$command" "./cmd/$command"
          done
          sha256sum dist/wan/* > dist/wan/SHA256SUMS

      - name: Prepare ephemeral SSH access and exact plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence/scaleway-wan
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/nomad-wan" -C "wan-${GITHUB_RUN_ID}"
          runner_ip="$(curl -4 --fail --silent --show-error --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "TF_VAR_ssh_public_key=$(cat "$RUNNER_TEMP/nomad-wan.pub")"
            echo "TF_VAR_admin_ipv4_cidr=${runner_ip}/32"
            echo "TF_VAR_deployment_id=gh-${GITHUB_RUN_ID}"
            echo 'TF_VAR_ttl_hours=2'
          } >> "$GITHUB_ENV"
          terraform -chdir=deploy/scaleway init
          terraform -chdir=deploy/scaleway plan -refresh=false -lock=false -out="$RUNNER_TEMP/nomad-wan.tfplan"
          terraform -chdir=deploy/scaleway show -no-color "$RUNNER_TEMP/nomad-wan.tfplan" > runtime/evidence/scaleway-wan/terraform-plan.txt
          terraform -chdir=deploy/scaleway show -json "$RUNNER_TEMP/nomad-wan.tfplan" > runtime/evidence/scaleway-wan/terraform-plan.json
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          plan = json.loads(Path('runtime/evidence/scaleway-wan/terraform-plan.json').read_text())
          changes = []
          for resource in plan.get('resource_changes', []):
              actions = resource.get('change', {}).get('actions', [])
              if actions == ['no-op']:
                  continue
              if actions != ['create']:
                  raise SystemExit(f"unexpected non-create action for {resource.get('address')}: {actions}")
              changes.append(resource)
          observed = collections.Counter(resource.get('type') for resource in changes)
          expected = collections.Counter({
              'scaleway_instance_ip': 6,
              'scaleway_instance_security_group': 3,
              'scaleway_instance_security_group_rules': 3,
              'scaleway_instance_server': 3,
          })
          if observed != expected:
              raise SystemExit(f"unexpected plan resource shape: {dict(observed)} != {dict(expected)}")
          Path('runtime/evidence/scaleway-wan/PLAN_OK.txt').write_text(
              'PASS: authenticated plan contains exactly 15 create-only WAN resources; apply not yet run.\n'
          )
          PY

      - name: Apply three disposable Scaleway nodes
        run: terraform -chdir=deploy/scaleway apply -auto-approve "$RUNNER_TEMP/nomad-wan.tfplan"

      - name: Record nodes and emergency destroy state
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=deploy/scaleway output -json nodes > runtime/evidence/scaleway-wan/nodes.json
          mkdir -p runtime/scaleway-state
          cp deploy/scaleway/terraform.tfstate runtime/scaleway-state/terraform.tfstate
          cat > runtime/scaleway-state/deployment.env <<EOF
          DEPLOYMENT_ID=${TF_VAR_deployment_id}
          ADMIN_IPV4_CIDR=${TF_VAR_admin_ipv4_cidr}
          TTL_HOURS=${TF_VAR_ttl_hours}
          APPLY_RUN_ID=${GITHUB_RUN_ID}
          EOF

      - name: Upload emergency state before measurement
        uses: actions/upload-artifact@v4
        with:
          name: scaleway-wan-state-${{ github.run_id }}
          path: runtime/scaleway-state/
          if-no-files-found: error
          retention-days: 7

      - name: Run real three-region DKG and 5-minute cadence capture
        env:
          CAPTURE_SECONDS: '300'
          TTL_HOURS: '2'
          DEPLOYMENT_ID: gh-${{ github.run_id }}
          EXPECTED_INTERVAL_MS: '50'
        run: |
          set -euo pipefail
          bash scripts/wan/scaleway-provision.sh \
            runtime/evidence/scaleway-wan/nodes.json \
            "$RUNNER_TEMP/nomad-wan" \
            dist/wan \
            runtime/evidence/scaleway-wan

      - name: Render result
        run: |
          set -euo pipefail
          python3 scripts/wan/summarize-result.py runtime/evidence/scaleway-wan
          cat runtime/evidence/scaleway-wan/RESULT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy disposable lab
        run: |
          set -euo pipefail
          terraform -chdir=deploy/scaleway destroy -auto-approve
          test "$(terraform -chdir=deploy/scaleway state list | wc -l)" -eq 0
          echo 'destroyed_after_campaign=true' > runtime/evidence/scaleway-wan/RESULT_STATE.txt

      - name: Fail-closed cleanup
        if: failure()
        continue-on-error: true
        run: |
          if test -s deploy/scaleway/terraform.tfstate; then
            terraform -chdir=deploy/scaleway destroy -auto-approve || true
          fi

      - name: Upload WAN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaleway-wan-evidence-${{ github.run_id }}
          path: runtime/evidence/scaleway-wan/
          if-no-files-found: warn
          retention-days: 30
