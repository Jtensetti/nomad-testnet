name: compose diagnostic

on:
  push:
    branches: [codex/production-readiness-20260824]
    paths:
      - '.github/workflows/compose-diagnostic.yml'
      - 'cmd/nomad-node/**'
      - 'deploy/**'
      - 'scripts/compose-e2e.sh'

permissions:
  contents: read

concurrency:
  group: compose-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install packet-capture verifier
        run: command -v tcpdump >/dev/null || (sudo apt-get update && sudo apt-get install -y tcpdump)
      - name: Run isolated multi-process fabric-to-cache network
        run: ./scripts/compose-e2e.sh
      - name: Upload diagnostics and packet/process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostic-${{ github.sha }}
          path: runtime/evidence/
          if-no-files-found: error
