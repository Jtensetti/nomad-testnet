name: timing campaign

# The wall-clock timing campaigns: the two-world wire campaign, the
# hostile-peer flood, and the airlock's sealing-duration measurements.
#
# They are not part of the per-push job. They take minutes under -race, and
# more importantly they are statistical comparisons whose control spread is a
# property of the host, so a busy shared runner makes them noisy in a way that
# says nothing about the code. Running them on their own gives them a machine
# to themselves and keeps the per-push job to checks that are deterministic.
#
# This is not a way of hiding a failing test. The campaign is currently
# reporting a real finding -- private activity perturbs the inter-arrival
# distribution -- and that finding is recorded in the protocol evidence index
# whatever this workflow does.

on:
  workflow_dispatch:
  schedule:
    # Once a day, so a regression surfaces without waiting for someone to ask.
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOMAD_TIMING_CAMPAIGN: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x'}

      # Without -race: these tests measure wall-clock timing, and the race
      # detector's own overhead is exactly the kind of ambient cost that
      # widens the control spread until nothing is decidable. Race coverage
      # for these packages comes from the per-push job.
      - name: Wire two-world campaign and hostile-peer flood
        run: go test -count=1 -v -run 'TestWire|TestFlood|TestHostile' ./live/node/

      - name: Airlock timing and permutation-uniformity measurements
        run: |
          go test -count=1 -v -timeout 30m \
            -run 'TestSealDuration|TestConcurrentDeposit|TestPermutationIsUniform' \
            ./live/airlock/

      - name: Apply the preregistered rule to the campaign captures
        if: always()
        run: |
          directory=runtime/evidence/wire-campaign
          # A campaign that produced nothing is a broken run, not a clean one.
          # Passing the gate because no capture exists is how an empty result
          # becomes evidence of indistinguishability.
          test -d "$directory" || { echo "no captures were produced"; exit 1; }
          compared=0
          findings=0
          # Per round: a series file spanning several rounds carries the pauses
          # during which the other worlds ran, so it is not the continuous
          # stream the rule compares windows of.
          for stressor in baseline cpu-starvation disk-pressure; do
            for control in "$directory/$stressor-control-a"*-r*.txt; do
              test -f "$control" || continue
              # The campaign may retry, naming the second attempt's series
              # "<stressor>-<world>-attempt2-r<N>". Take whatever follows
              # "control-a" so a retry's rounds are compared against that
              # retry's own controls rather than skipped.
              name=$(basename "$control" .txt)
              tail="${name#$stressor-control-a}"
            for pair in "control-b:idle vs idle (control)" "active:idle vs active"; do
              world="${pair%%:*}"
              treatment="$directory/$stressor-$world$tail.txt"
              test -f "$treatment" || continue
              echo "== $stressor$tail: ${pair#*:} =="
              # The default shell is bash -e, so the non-zero exit has to be
              # caught here or the step aborts before the status is read and
              # the remaining comparisons never run.
              status=0
              python3 scripts/two-world-analysis.py "$control" \
                "$treatment" 1200 20 || status=$?
              compared=$((compared + 1))
              # Exit 2 means the rule could not run -- unreadable captures, or
              # a round too short to evaluate. That is a broken run rather than
              # a verdict, and must not be reported as either a pass or a
              # finding.
              if [ "$status" -eq 2 ]; then
                echo "the rule could not run on $stressor $round"
                exit 1
              fi
              # 1 is a finding on emitted traffic, 3 on received traffic. Both
              # are findings. Accumulating them without failing the step, which
              # is what this did until 2026-08-21, makes the gate report green
              # on a rejected run.
              if [ "$status" -ne 0 ]; then
                findings=$((findings + 1))
              fi
            done
            done
          done
          if [ "$compared" -eq 0 ]; then
            echo "no capture pairs were compared; the gate checked nothing"
            exit 1
          fi
          echo "compared $compared pair(s)"
          if [ "$findings" -gt 0 ]; then
            echo "$findings preregistered comparison(s) were rejected"
            exit 1
          fi

      - name: Upload campaign captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-campaign-captures
          path: runtime/evidence/wire-campaign/
          if-no-files-found: warn
