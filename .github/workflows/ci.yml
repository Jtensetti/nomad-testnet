name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x'}
      - name: Verify pinned component snapshots
        run: sha256sum --check --quiet COMPONENTS.sha256
      - name: Verify generated formatting and module graph
        run: |
          gofmt -w .
          go mod tidy
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Enforce Selection Firewall dependency direction
        run: |
          network_deps="$(go list -deps \
            github.com/Jtensetti/nomad-testnet/live/node \
            github.com/Jtensetti/nomad-testnet/live/hop \
            github.com/Jtensetti/nomad-testnet/live/bundle \
            github.com/Jtensetti/nomad-testnet/live/rawcache \
            github.com/Jtensetti/nomad-testnet/live/topology)"
          if printf '%s\n' "$network_deps" | grep -Eq 'nomad-(semantic-basins|local-reconstruction)'; then
            echo "network domain imports private selection or reconstruction code"
            exit 1
          fi
          materializer_imports="$(go list -f '{{join .Imports "\n"}}' github.com/Jtensetti/nomad-testnet/live/materialize)"
          if printf '%s\n' "$materializer_imports" | grep -Eq '(^net$|nomad-testnet/live/node|nomad-constant-rate-fabric|nomad-selection-firewall|nomad-semantic-basins)'; then
            echo "materializer directly imports network control or query code"
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...

  live-compose:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install packet-capture verifier
        run: command -v tcpdump >/dev/null || (sudo apt-get update && sudo apt-get install -y tcpdump)
      - name: Run isolated multi-process fabric-to-cache network
        run: ./scripts/compose-e2e.sh
      - name: Upload packet and process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-fabric-evidence
          path: runtime/evidence/
          if-no-files-found: warn
