name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Explain private sibling requirement
        run: |
          echo "nomad-testnet composes private sibling repositories."
          echo "Configure a NOMAD_CI_TOKEN with read access before enabling multi-repo checkout CI."
      - name: Static workflow guard
        run: test -n "${{ github.repository }}"
