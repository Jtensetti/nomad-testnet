name: ci
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  # A superseded run tells nobody anything: it is testing a candidate that has
  # already been replaced, while consuming a runner the new candidate needs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.25.x'}
      - name: Verify pinned component snapshots
        run: sha256sum --check --quiet COMPONENTS.sha256
      - name: Verify generated formatting and module graph
        run: |
          unformatted="$(gofmt -l cmd live testnet components supplychain deploy)"
          if test -n "$unformatted"; then
            printf 'unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d cmd live testnet components supplychain deploy
            exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Static analysis, failing closed
        run: |
          # staticcheck exits 0 when it cannot analyse a module, so "clean" and
          # "read nothing" are the same exit code. The script proves the tool is
          # analysing with a positive control before it trusts a clean run.
          ./scripts/run-staticcheck.sh
      - name: Enforce Selection Firewall dependency direction
        run: |
          network_deps="$(go list -deps \
            github.com/Jtensetti/nomad-testnet/cmd/nomad-node \
            github.com/Jtensetti/nomad-testnet/cmd/nomad-dkg \
            github.com/Jtensetti/nomad-testnet/cmd/nomad-operator \
            github.com/Jtensetti/nomad-testnet/cmd/nomad-partial-fetch \
            github.com/Jtensetti/nomad-testnet/cmd/nomad-topology \
            github.com/Jtensetti/nomad-testnet/live/node \
            github.com/Jtensetti/nomad-testnet/live/hop \
            github.com/Jtensetti/nomad-testnet/live/bundle \
            github.com/Jtensetti/nomad-testnet/live/ceremony \
            github.com/Jtensetti/nomad-testnet/live/committee \
            github.com/Jtensetti/nomad-testnet/live/dkg \
            github.com/Jtensetti/nomad-testnet/live/fetchplan \
            github.com/Jtensetti/nomad-testnet/live/partialfetch \
            github.com/Jtensetti/nomad-testnet/live/rawcache \
            github.com/Jtensetti/nomad-testnet/live/epoch \
            github.com/Jtensetti/nomad-testnet/live/topology)"
          if printf '%s\n' "$network_deps" | grep -Eq 'nomad-(semantic-basins|local-reconstruction)'; then
            echo "network domain imports private selection or reconstruction code"
            exit 1
          fi
          # The publication API must have no network capability, transitively.
          # Publish is a purely local operation; the only way a fragment
          # leaves the queue is a pull by the constant-rate scheduler.
          # nomad-publish is the one process that holds both halves: a queue of
          # private publication work and a socket. That is not a violation --
          # it is where the two must meet -- so it gets a rule of its own
          # rather than an exemption. It must not reach reader selection.
          publisher_deps="$(go list -deps github.com/Jtensetti/nomad-testnet/cmd/nomad-publish)"
          if printf '%s\n' "$publisher_deps" | grep -Eq 'nomad-(semantic-basins|local-reconstruction|selection-firewall)|nomad-testnet/live/(fetchplan|partialfetch|materialize|node)'; then
            echo "the publisher reaches reader selection, reconstruction or peer choice"
            exit 1
          fi
          publish_deps="$(go list -deps github.com/Jtensetti/nomad-testnet/live/publish)"
          if printf '%s\n' "$publish_deps" | grep -Eq '^(net|net/http|net/url|os/exec)$'; then
            echo "publication API reaches a socket or process-launch capability"
            exit 1
          fi
          if printf '%s\n' "$publish_deps" | grep -Eq 'nomad-(constant-rate-fabric|selection-firewall)|nomad-testnet/live/(node|hop|fetchplan|partialfetch|uplink)'; then
            echo "publication API imports transport, peer selection or scheduling"
            exit 1
          fi
          # The airlock decides when a batch closes and what goes in it. If it
          # could reach a socket or a scheduler, the release boundary could be
          # made to depend on what is in the queue, which is the one thing the
          # fixed schedule exists to prevent.
          airlock_deps="$(go list -deps github.com/Jtensetti/nomad-testnet/live/airlock)"
          if printf '%s\n' "$airlock_deps" | grep -Eq '^(net|net/http|net/url|os/exec)$'; then
            echo "publication airlock reaches a socket or process-launch capability"
            exit 1
          fi
          if printf '%s\n' "$airlock_deps" | grep -Eq 'nomad-(constant-rate-fabric|selection-firewall)|nomad-testnet/live/(node|hop|fetchplan|partialfetch|uplink)'; then
            echo "publication airlock imports transport, peer selection or scheduling"
            exit 1
          fi
          # An availability report is an externally observable artefact, so
          # whatever decides to emit one must be public. If the observer could
          # reach a query, a basin or a reconstruction, the presence or shape
          # of a report would carry private activity onto the network.
          availability_deps="$(go list -deps github.com/Jtensetti/nomad-testnet/live/availability)"
          if printf '%s\n' "$availability_deps" | grep -Eq 'nomad-(semantic-basins|local-reconstruction|selection-firewall)|nomad-testnet/live/(fetchplan|partialfetch|materialize|publish)'; then
            echo "availability observer reaches private selection, reconstruction or the reader path"
            exit 1
          fi
          materializer_imports="$(go list -f '{{join .Imports "\n"}}' github.com/Jtensetti/nomad-testnet/live/materialize)"
          if printf '%s\n' "$materializer_imports" | grep -Eq '(^net$|nomad-testnet/live/node|nomad-constant-rate-fabric|nomad-selection-firewall|nomad-semantic-basins)'; then
            echo "materializer directly imports network control or query code"
            exit 1
          fi
      - name: Enforce the telemetry allowlist has a reason for every field
        run: |
          # A field may only be emitted if someone wrote down why it is
          # public. This fails the build rather than a review comment.
          go test ./live/telemetry/ ./live/node/ -run 'Telemetry|telemetry|SecretScan|OperationalOutput' -count=1
      - name: Run the suite, leaving the cadence tests their own machine
        run: |
          # live/node holds the tests that measure a running node against a
          # wall-clock cadence, and `go test ./...` runs up to GOMAXPROCS
          # packages at once. Its neighbours here are live/airlock, live/deposit
          # and live/materialize, at 254s, 188s and 220s in the run that failed,
          # and all three drive the mix, whose Encrypt spawns GOMAXPROCS
          # goroutines per call. A receive loop competing with that misses
          # datagrams in the kernel, and TestAFloodFromOnePeerDoesNotStarveAnother
          # then reports a starvation it never measured.
          #
          # That test is deliberately a failure rather than a skip -- a machine
          # where the property is untested should be visible, not green -- so
          # the fix is to give it a machine rather than to soften the verdict.
          # NOMAD_REQUIRE_CAPABILITY_GATES declares what this environment can
          # run. A skip is green, so without it the cross-implementation check
          # would stop running the day the image dropped python3 and PROD-03
          # would go on citing evidence nothing had produced.
          export NOMAD_REQUIRE_CAPABILITY_GATES=1
          go test -race $(go list ./... | grep -v '/live/node$')
          go test -race ./live/node/
      - name: Test every vendored component module
        run: |
          # components/* are separate Go modules wired in via replace
          # directives, so `go test ./...` at the root never touches them.
          # The rlnc decoder shipped a silent wrong-decode defect through this
          # gap: the fix and its regression test existed in the standalone
          # repo's suite while the vendored copy CI actually built went
          # untested. What ships is what must be tested.
          for module in components/*/; do
            echo "== $module =="
            (cd "$module" && go build ./... && go vet ./... && go test -race -count=1 ./...)
          done
      - name: Validate the corpus against its published schema
        run: |
          # PROD-01 recorded that the corpus was a JSON file whose shape was
          # enforced only by its own encoder, so a second implementation had
          # nothing to validate against. The schema is now published and this
          # keeps it from drifting away from the file it describes.
          python3 scripts/validate-corpus-schema.py
      - name: Verify the published conformance corpus matches its encoders
        run: go run ./cmd/nomad-conformance -check conformance/wire-vectors.json
      - name: Run the incident drill
        run: |
          # PROD-28 asks that incident response is exercised. The drill starts
          # three real nodes on loopback and works the two scenarios in
          # deploy/RECOVERY.md: a node that is present and not working, and a
          # hop sequence file restored from backup. A runbook whose drill has
          # not been run since the code moved is a document about an older
          # system, so it runs here rather than on request.
          ./scripts/incident-drill.sh
      - name: Interoperate with the second implementation
        run: |
          # PROD-03 asks that two implementations interoperate for the public
          # wire protocol without sharing protocol code.
          # conformance/reference/ holds the second one: another language, no
          # shared build, no dependency past its standard library, written
          # from nomad-protocol docs/PROTOCOL.md rather than from this
          # repository's Go. nomadwire.py covers the hop cell, nomadtopology.py
          # the signed topology, nomadobject.py the object manifest and
          # nomaduplink.py the publisher uplink frame and its derivations --
          # every message type the corpus publishes.
          #
          # Running it standalone here as well as from the Go test means the
          # second implementation is exercised even if the Go side is skipped
          # for want of a python3 on the runner.
          python3 conformance/reference/crosscheck.py conformance/wire-vectors.json
      - name: Verify the corpus is identical on a different word size
        run: |
          # A golden vector that depends on the host's int width is not a
          # golden vector. 386 has 32-bit int against amd64's 64-bit, so an
          # encoder that leaked word size would produce a different digest
          # here. This is the cross-platform half of PROD-16 that a single
          # architecture cannot supply.
          GOARCH=386 go run ./cmd/nomad-conformance -check conformance/wire-vectors.json
          GOARCH=386 go test -count=1 ./live/conformance/ ./live/topology/ ./live/batch/
      - name: Verify the supported platforms still build
        run: |
          # windows/amd64 was absent and did not build: live/epoch's chain lock
          # used unix.Flock unconditionally. The criterion says cross-platform,
          # so the gap was recorded as a blocker rather than left to be found.
          # It is now a LockFileEx implementation behind a build tag, and the
          # target is in the matrix so it cannot regress silently.
          for target in linux/amd64 linux/386 linux/arm64 linux/arm \
                        darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... \
              || { echo "$target does not build"; exit 1; }
          done
      - name: Verify the vulnerability gate still fails closed
        run: ./scripts/test-scan-vulnerabilities.sh
      - name: Scan dependencies for reachable vulnerabilities
        run: |
          # A vulnerability gate in one repository is a gate on one repository.
          # This ran only in Nomad-browser, leaving the integration root -- the
          # one that actually ships operator binaries -- unscanned. Each
          # vendored component module is scanned too: they are separate modules
          # behind replace directives, so a root scan never reaches them, which
          # is the same gap that let an untested rlnc decoder ship.
          # go mod verify answers a question govulncheck does not: whether
          # every module in the build cache still hashes to what go.sum
          # recorded. A vulnerability scan on substituted bytes reports on
          # the wrong code.
          go mod verify
          for module in components/*/; do
            (cd "$module" && go mod verify)
          done
          ./scripts/scan-vulnerabilities.sh . components/*/
      - name: Verify the traffic-analysis harness still detects differences
        run: python3 scripts/test-two-world-analysis.py
      - name: Verify the campaign verdict still separates noise from a finding
        run: python3 scripts/wan/test-wan-verdict.py
      - name: Verify the load verdict refuses a flood that never arrived
        run: python3 scripts/test-load-verdict.py
      - name: Run the deposit-path experiments and produce campaign evidence
        run: |
          # Deliberately not under -race, and this is the run that counts for
          # both experiments in this package.
          #
          # The campaign times emissions against a 150 ms interval calibrated
          # on the real ~87 ms seal cost. The race detector instruments every
          # memory access and pushes a seal past the interval, so the loop
          # stops following its ticker and the capture measures the detector
          # rather than the protocol. The correlation experiment runs
          # thirty-six full mixes and no goroutines at all, so the detector has
          # nothing to find there and costs about eight times as much looking.
          # Together they took the package past Go's ten-minute default
          # timeout, which is how this split came about.
          #
          # Under -race both are shortened or skipped, and Drain's concurrency
          # is still covered there by the emission, close and campaign tests.
          #
          # Two unlinkability measurements live behind this step for the same
          # reason, and this is the only place they execute: the correlation
          # experiment, and the chain-contribution experiment that measures an
          # adversary inside the committee. Both skip under -race, so removing
          # this step would leave the airlock's privacy claims with no CI
          # evidence at all while every other gate still went green.
          go test -count=1 -timeout 25m ./live/deposit/
      - name: Apply the preregistered rule to the publication campaign
        run: |
          directory=runtime/evidence/publication-campaign
          test -f "$directory/control-a.txt" || {
            echo "the publication campaign produced no captures"; exit 1; }
          findings=0
          # Against the steady control: publication succeeding, timing out or
          # being lost must not change what an observer sees.
          for world in control-b success timeout loss; do
            echo "== control-a vs $world =="
            status=0
            python3 scripts/two-world-analysis.py "$directory/control-a.txt" \
              "$directory/$world.txt" 1200 150 || status=$?
            if [ "$status" -eq 2 ]; then echo "the rule could not run"; exit 1; fi
            if [ "$status" -ne 0 ]; then findings=$((findings + 1)); fi
          done
          # A restart is externally observable by construction, so the pair
          # that answers the criterion is restart-with-work against
          # restart-without-work: the interruption is common to both and the
          # private variable is the only difference.
          echo "== restart-idle vs restart =="
          status=0
          python3 scripts/two-world-analysis.py "$directory/restart-idle.txt" \
            "$directory/restart.txt" 1200 150 || status=$?
          if [ "$status" -eq 2 ]; then echo "the rule could not run"; exit 1; fi
          if [ "$status" -ne 0 ]; then findings=$((findings + 1)); fi
          if [ "$findings" -gt 0 ]; then
            echo "$findings publication comparison(s) were rejected"
            exit 1
          fi
      - name: Run independent operator ceremony
        env:
          NOMAD_CEREMONY_EVIDENCE: runtime/evidence/operator-ceremony.json
        run: ./scripts/ceremony-e2e.sh
      - run: go vet ./...
      - name: Upload operator ceremony evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-ceremony-evidence
          path: runtime/evidence/operator-ceremony.json
          if-no-files-found: warn
  live-compose:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packet-capture verifier
        run: command -v tcpdump >/dev/null || (sudo apt-get update && sudo apt-get install -y tcpdump)
      # The load generator is built on the host rather than shipped in the
      # release image, so this job needs a toolchain of its own. Without it the
      # gate would build against whatever Go the runner happens to preinstall.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run isolated multi-process fabric-to-cache network
        run: ./scripts/compose-e2e.sh
      - name: Upload packet and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-fabric-evidence
          path: runtime/evidence/
          if-no-files-found: warn

  release:
    needs: [unit, live-compose]
    if: >-
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify release commit marker
        id: eligibility
        run: |
          subject="$(git log -1 --pretty=%s)"
          if printf '%s\n' "$subject" | grep -q '^release:'; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.eligibility.outputs.release == 'true'
        with: {go-version: '1.25.x'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.eligibility.outputs.release == 'true'
        with:
          name: live-fabric-evidence
          path: evidence/fabric
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.eligibility.outputs.release == 'true'
        with:
          name: operator-ceremony-evidence
          path: evidence/ceremony
      - name: Build commit-addressed operator bundle
        if: steps.eligibility.outputs.release == 'true'
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          for command in nomad-bootstrap nomad-dkg nomad-fixture-publisher nomad-node nomad-operator nomad-topology nomad-share nomad-partial-fetch nomad-materializer; do
            go build -trimpath -ldflags='-s -w' -o "dist/$command" "./cmd/$command"
          done
          tar -C dist -czf nomad-live-linux-amd64.tgz .
          zip -qr live-fabric-evidence.zip evidence
          sha256sum nomad-live-linux-amd64.tgz live-fabric-evidence.zip > SHA256SUMS
      - name: Publish gated live-testnet prerelease
        if: steps.eligibility.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          tag="nomad-live-testnet-${short_sha}"
          gh release create "$tag" \
            nomad-live-linux-amd64.tgz live-fabric-evidence.zip SHA256SUMS \
            --target "$target_sha" \
            --prerelease \
            --title "Nomad live fabric testnet (${short_sha})" \
            --notes "Reader-side live testnet with offline operator enrollment/attestation, dedicated DKG identities, a three-process TLS Pedersen DKG, unanimous committee activation, descriptor-v2 certificate binding, locally derived X25519+HKDF hop keys, fixed-cadence authenticated UDP, distributed threshold partials, networkless materialization, packet/DKG/process evidence, and browser-compatible verified output. This is not an audited production anonymity network; see LIVE_DOD.md for external gates."
