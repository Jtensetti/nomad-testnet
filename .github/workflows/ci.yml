name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.25.x'}
      - name: Verify pinned component snapshots
        run: sha256sum --check --quiet COMPONENTS.sha256
      - name: Verify module snapshot is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"
      - name: Enforce Selection Firewall dependency direction
        run: |
          network_deps="$(go list -deps github.com/Jtensetti/nomad-constant-rate-fabric/fabric github.com/Jtensetti/nomad-selection-firewall/firewall github.com/Jtensetti/nomad-anytrust-mix-sim/mix)"
          if printf '%s\n' "$network_deps" | grep -Eq 'nomad-(semantic-basins|local-reconstruction)'; then
            echo "network domain imports private selection code"
            exit 1
          fi
          private_deps="$(go list -deps github.com/Jtensetti/nomad-semantic-basins/basin github.com/Jtensetti/nomad-local-reconstruction/reconstruct)"
          if printf '%s\n' "$private_deps" | grep -Eq 'nomad-(constant-rate-fabric|selection-firewall|anytrust-mix-sim)'; then
            echo "private domain imports network-control code"
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
