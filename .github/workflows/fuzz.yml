name: fuzz

# The signed topology is the document that decides who the peers are, and it
# arrives from the network. `go test` replays a fuzz target's committed seed
# corpus, which makes it a regression test; nothing here had ever fuzzed.
#
# Not in the per-push job, because fuzzing is not deterministic and a new
# crasher should mean "the fuzzer found something" rather than turning an
# unrelated push red.
on:
  # `schedule` and `workflow_dispatch` fire only from the default branch, and
  # this file will not be there for a while. A workflow that cannot run is
  # worth less than no workflow, because it looks like coverage -- see
  # nomad-protocol F-28.
  push:
    paths:
      - "live/topology/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}

      - name: Fuzz the topology canonicalisation
        run: |
          go test ./live/topology/ -run '^$' \
            -fuzz '^FuzzCanonicalisationIsIdempotent$' -fuzztime=300s | tee fuzz.log

      # A fuzzer that explores nothing passes by finding nothing, the same way
      # a scan that returns nothing does. Five minutes finds hundreds of new
      # inputs locally; zero means the target is no longer reachable past its
      # seeds, which is a broken target rather than a clean run.
      - name: Require the target to have explored
        run: |
          interesting=$(grep -o 'new interesting: [0-9]*' fuzz.log | tail -1 | grep -o '[0-9]*$')
          test -n "$interesting" || { echo "no coverage line in the fuzzer output"; exit 1; }
          echo "the target found $interesting new interesting inputs"
          test "$interesting" -gt 0 || {
            echo "the target explored nothing past its seed corpus, so it is"
            echo "replaying seeds rather than fuzzing"
            exit 1
          }

      - name: Upload any crasher the fuzzer wrote
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: |
            live/topology/testdata/fuzz/**
            fuzz.log
          if-no-files-found: warn
